# After a push to any branch except main, wait for Cloudflare's preview build
# of that commit and check that the preview answers the way the live site
# should: pages load, old addresses still redirect, unknown addresses give the
# 404 page, and the accounts API responds. Read-only; it changes nothing.
name: Preview check

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      url:
        description: Site to check (for example https://logpose.cards)
        required: false

permissions:
  contents: read
  checks: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Cloudflare build of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
              --jq '[.check_runs[] | select(.name | startswith("Workers Builds"))][0] | "\(.status) \(.conclusion)"')
            echo "build: $state"
            case "$state" in "completed success") exit 0 ;; completed*) echo "Cloudflare build did not succeed"; exit 1 ;; esac
            sleep 15
          done
          echo "Timed out waiting for the Cloudflare build"; exit 1
      - name: Check the preview
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          if [ -n "$INPUT_URL" ]; then base="${INPUT_URL%/}"; else
            base="https://$(echo "$GITHUB_REF_NAME" | tr -c 'a-zA-Z0-9\n' '-' | tr 'A-Z' 'a-z')-logpose.alpinekicks0.workers.dev"; fi
          echo "Checking $base"
          fail=0
          expect() { # label, expected status, path, [text the body must contain]
            out=$(curl -sS -o body.txt -w '%{http_code} %{redirect_url}' --max-time 30 "$base$3" || true)
            code=${out%% *}
            if [ "$code" != "$2" ]; then echo "FAIL $1: $3 gave $out, wanted $2"; fail=1; return; fi
            if [ -n "$4" ] && ! grep -q -- "$4" body.txt; then echo "FAIL $1: $3 is missing '$4'"; head -c 300 body.txt; echo; fail=1; return; fi
            echo "ok   $1: $3 -> $out"
          }
          expect "home page"            200 /                         'HOME_URL = "/"'
          expect "home loads accounts"  200 /                         '/assets/account.js'
          expect "card page"            200 /card/nami-op15-108/      'lp-actions'
          expect "all cards"            200 /cards/                   'Log Pose'
          expect "account page"         200 /account/                 'lp-account'
          expect "account script"       200 /assets/account-app.js    'lp-account'
          expect "card index"           200 /assets/cards-index.json  'luffy-st01-001-serial-2023'
          expect "sitemap"              200 /sitemap.xml              '<urlset'
          expect "unknown address"      404 /this-page-does-not-exist/ 'Page not found'
          old=$(grep -m1 -E '^/card/[^ ]+ +/card/[^ ]+ +301' public/_redirects | awk '{print $1}')
          if [ -n "$old" ]; then expect "old card address redirects" 301 "$old" ''; fi
          expect "accounts API answers" 200 /api/config               '"ready"'
          echo "--- /api/config"; curl -sS --max-time 30 "$base/api/config"; echo
          echo "--- /api/me (status)"; curl -sS -o /dev/null -w '%{http_code}\n' --max-time 30 "$base/api/me"
          echo "--- cache headers"; curl -sSI --max-time 30 "$base/assets/account.js" | grep -i -E 'cache-control|content-type' || true
          exit $fail
