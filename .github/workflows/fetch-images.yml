name: Fetch card images

# Downloads the official scans listed in tools/image-manifest.txt into incoming/
# and commits them. Runs when the manifest changes, or by hand.
on:
  push:
    branches: [main]
    paths: ['tools/image-manifest.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Download
        run: python3 tools/fetch_images.py tools/image-manifest.txt incoming
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incoming
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Fetch official card scans listed in the image manifest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
